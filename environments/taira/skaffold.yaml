apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: taira
build:
  local:
    push: false
    useBuildkit: true
  artifacts:
    - image: taira
      context: ../..
      docker:
        dockerfile: environments/taira/Dockerfile
manifests:
  rawYaml:
    - k8s/app.yaml
deploy:
  kubectl: {}
portForward:
  - resourceType: service
    resourceName: taira
    port: 8080
    localPort: 8888
